<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GPU Memory Validator · Workbench</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<aside class="sidebar"><div class="brand-mark">M<span>V</span></div><div class="brand">MEMORY<br>VALIDATOR</div><p class="sidebar-caption">실험 워크벤치</p><nav aria-label="주 메뉴"><button data-view="runs" class="active">◫ <span>실행 결과</span></button><button data-view="patterns">▦ <span>메모리 패턴</span></button><button data-view="profiles">☷ <span>실험 프리셋</span></button></nav><div class="sidebar-foot"><span class="dot"></span> 로컬 워크스페이스<br><small>CUDA 검증 · CPU 독립 대조</small></div></aside>
<main><header><div><div class="eyebrow">GPU MEMORY VALIDATOR / WORKBENCH</div><h1 id="page-title">실행 결과</h1><p id="page-caption">실행 조건부터 검증 결과까지, 기록을 따라 확인하세요.</p></div><button id="refresh" class="secondary">↻ 새로고침</button></header>
<div id="notice" role="status" aria-live="polite" hidden></div>
<section id="overview" class="overview" aria-label="실행 요약"></section>
<div class="workspace"><section class="list-panel"><div class="list-tools"><input id="search" aria-label="목록 검색" placeholder="기록 검색"><button id="new-document" class="primary" hidden>＋ 새로 만들기</button></div><div id="list" class="list"></div></section><section id="detail" class="detail" aria-label="선택한 항목"></section></div>
<footer>실험 설정과 원시 기록을 함께 보존합니다. 실행 시간은 CPU 대조를 포함한 전체 프로세스 시간입니다.</footer>
</main>
</body></html>
